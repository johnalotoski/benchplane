[workspace]
members = [
  "crates/benchplane",
  "crates/benchplane-core",
  "crates/benchplane-schema",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/johnalotoski/benchplane"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "1.0", default-features = false, features = [
  "deserialize",
] }
sha2 = "0.10"
thiserror = "2.0"
