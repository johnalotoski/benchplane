name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake
        run: nix flake check --show-trace
      - name: Validate OpenTofu configuration
        run: nix develop -c just tofu-validate
